name: Mise à jour des marées, du soleil et de la lune

on:
  schedule:
    # Le 1er et le 15 de chaque mois à 03:00 UTC (07:00 à Maurice)
    - cron: "0 3 1,15 * *"
  workflow_dispatch: {}   # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer les marées (Météo Maurice)
        id: tides
        continue-on-error: true
        run: python scripts/update_tides.py

      - name: Récupérer soleil, lune et phases (Météo Maurice)
        id: sunmoon
        continue-on-error: true
        run: python scripts/update_sun_moon.py

      - name: Publier les nouvelles données
        run: |
          git config user.name "marees-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Données : mise à jour du $(date -u +%Y-%m-%d)"
          git push

      - name: Signaler un échec de lecture
        if: steps.tides.outcome == 'failure' || steps.sunmoon.outcome == 'failure'
        run: |
          echo "::error::Une page de Météo Maurice n'a pas pu être lue (détail dans les étapes ci-dessus). Les données existantes sont conservées."
          exit 1
